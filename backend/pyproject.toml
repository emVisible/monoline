[project]
name = "monoline-backend"
version = "0.1.0"
description = "Monoline — local text→video tool (backend: job store, pipeline, render orchestration)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "jinja2>=3.1",
  "typer>=0.15",
  "fonttools>=4.55",
  "brotli>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Lands in the SAME pinned 3.11 venv → this venv doubles as HYPERFRAMES_PYTHON.
# misaki[zh] is not optional for Chinese: it is the only G2P here that carries lexical
# tones into Kokoro's vocabulary (kokoro-onnx's espeak path drops them — see monoline/tts_zh.py).
tts = ["kokoro-onnx>=0.6", "onnxruntime>=1.20", "soundfile>=0.12", "misaki[zh]>=0.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
monoline = "monoline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monoline"]

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
