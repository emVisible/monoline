<!doctype html>
<!-- lang is the app's default (Chinese); i18n.tsx rewrites it at runtime when the
     preference is English, so the document never disagrees with what is on screen. -->
<html lang="zh-CN" data-theme="mono-ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#0b0b0c" />

    <title>Monoline · 贴一段文字，出一条片子</title>
    <meta name="application-name" content="Monoline" />
    <meta name="author" content="emVisible" />
    <meta name="description" content="Monoline turns a pasted script into a narrated explainer video: it cuts the text into beats, voices each one, and storyboards every beat by content — monochrome, deterministic, rendered locally. 贴一段文字，自动分镜、逐拍配音，本地导出一条单色极简的说明视频。" />
    <meta name="keywords" content="text to video, storyboard, narration, explainer video, local-first, 文字转视频, 自动分镜, 旁白, 本地渲染" />

    <!-- The app binds to localhost and its pages contain unpublished drafts, so the
         default is to stay out of indexes. Flip to index,follow only if it is ever
         deployed somewhere public on purpose. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- What leaves the machine when someone shares the link is English-primary; the
         <title> above stays Chinese because the app's default UI language is Chinese. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monoline" />
    <meta property="og:url" content="https://github.com/emVisible/monoline" />
    <meta property="og:title" content="Monoline — paste a script, get a film" />
    <meta property="og:description" content="One sentence, one beat, one slide. Auto-storyboarded across 28 scene kinds, narrated per beat, monochrome, rendered locally to MP4." />
    <meta property="og:image" content="https://raw.githubusercontent.com/emVisible/monoline/main/web/public/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Monoline: one sentence, one beat, one slide — on a black card with a lime accent rule." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monoline — paste a script, get a film" />
    <meta name="twitter:description" content="Auto-storyboarded, narrated, monochrome explainer videos rendered locally from pasted text." />
    <meta name="twitter:image" content="https://raw.githubusercontent.com/emVisible/monoline/main/web/public/og.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Monoline",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "macOS, Linux",
      "url": "https://github.com/emVisible/monoline",
      "codeRepository": "https://github.com/emVisible/monoline",
      "image": "https://raw.githubusercontent.com/emVisible/monoline/main/web/public/og.png",
      "description": "Turns a pasted text script into a narrated, monochrome explainer video. Local, single-user, no account: one Python process owns the job store, the pipeline and the render.",
      "programmingLanguage": ["Python", "TypeScript"],
      "softwareRequirements": ["Python 3.11 (uv)", "Node 22", "FFmpeg"],
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Monoline 的界面需要 JavaScript。也可以在终端里直接用命令行出片：
      <code>monoline run-script &lt;script.txt&gt;</code>。
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
